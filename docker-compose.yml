version: "3.9"

# Production Docker Compose for Trustifyee Trading Backend
# Usage:
#   docker compose up -d
#   docker compose logs -f backend
#   docker compose down

services:
  # ─────────────────────────────────────────────
  # Redis — BullMQ queue store + session locks
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: trustifyee-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"   # Bind to localhost only — never expose to internet
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --requirepass "${REDIS_PASSWORD:-}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trustifyee-net

  # ─────────────────────────────────────────────
  # MongoDB — Primary database
  # ─────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: trustifyee-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"  # Bind to localhost only
    environment:
      MONGO_INITDB_DATABASE: trustifyee
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    command: mongod --wiredTigerCacheSizeGB 0.5
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - trustifyee-net

  # ─────────────────────────────────────────────
  # Backend — Node.js Trading Engine
  # ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustifyee-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"  # Nginx will proxy — don't expose directly
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/trustifyee
      REDIS_URL: redis://redis:6379
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - trustifyee-net
    # Resource limits — prevent memory leak from crashing the host
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  redis_data:
    driver: local
  mongo_data:
    driver: local
  mongo_config:
    driver: local

networks:
  trustifyee-net:
    driver: bridge
