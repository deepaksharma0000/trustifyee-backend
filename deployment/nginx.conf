# Nginx Production Config for Trustifyee Trading Platform
# Place at: /etc/nginx/sites-available/trustifyee
# Enable: ln -s /etc/nginx/sites-available/trustifyee /etc/nginx/sites-enabled/
# Test:   nginx -t
# Reload: systemctl reload nginx

# Rate limiting zones — protect Angel One API from bot hammering
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=signals:10m rate=10r/m;

# Upstream backend
upstream trustifyee_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name trustifye.cloud www.trustifye.cloud;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    server_name trustifye.cloud www.trustifye.cloud;

    # SSL — managed by Certbot (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/trustifye.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trustifye.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' wss: https:;" always;

    # Logs
    access_log /var/log/nginx/trustifyee.access.log;
    error_log  /var/log/nginx/trustifyee.error.log;

    # Max upload size (for broker credential uploads)
    client_max_body_size 10M;

    # ─── API Backend ───────────────────────────
    location /api/ {
        # Rate limit general API
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://trustifyee_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts — Angel One API calls can take up to 30 seconds
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Auth endpoints get stricter rate limiting
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://trustifyee_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Signal endpoints
    location /api/signals/ {
        limit_req zone=signals burst=10 nodelay;

        proxy_pass http://trustifyee_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── WebSocket (Socket.IO) ─────────────────
    location /socket.io/ {
        proxy_pass http://trustifyee_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket keepalive — important for long-lived trading connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ─── WebSocket (Signals & Market Stream) ───
    location /ws/ {
        proxy_pass http://trustifyee_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket keepalive
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ─── Frontend React App ────────────────────
    location / {
        root /var/www/trustifyee/build;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ─── Health check (no rate limit) ─────────
    location /health {
        proxy_pass http://trustifyee_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
